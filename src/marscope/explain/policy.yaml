    title: "Reducing Risks Posed by Synthetic Content"
    url: https://www.nist.gov/publications/reducing-risks-posed-synthetic-content-overview-technical-approaches-digital-content
  mit-ai-risk:
    label: MIT AI Risk Repository
    title: "MIT AI Risk Repository V4 (Slattery et al., arXiv:2408.12622; CC BY 4.0)"
    url: https://airisk.mit.edu/
