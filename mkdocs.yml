extra_css:
  - stylesheets/extra.css
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/VectorInstitute/marscope
markdown_extensions:
  - attr_list
  - admonition
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Start here:
      - What it does: overview.md
      - Quickstart: quickstart.md
  - How it works: how_it_works.md
  - Guides:
      - Installation: guides/install.md
      - Web UI and serving: guides/serve.md
      - Command line: guides/cli.md
      - Reports and Ask: guides/report.md
      - REST API: guides/rest.md
      - Python API: guides/python.md
  - Reference:
      - API Reference: api.md
      - Development: reference/dev.md
  - FAQ: faq.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            members_order: source
            separate_signature: true
            show_overloads: true
            show_submodules: true
            show_root_heading: false
            show_root_full_path: true
            show_root_toc_entry: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
repo_url: https://github.com/VectorInstitute/marscope
edit_uri: edit/main/docs/
repo_name: VectorInstitute/marscope
site_name: MARScope
site_url: https://vectorinstitute.github.io/marscope/
theme:
  custom_dir: docs/overrides
  favicon: assets/favicon-48x48.svg
  font:
    text: Open Sans
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  logo: assets/vector-logo-black.svg
  logo_footer: assets/vector-logo.svg
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: vector
      accent: vector-teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: vector-teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
