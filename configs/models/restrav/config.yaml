# ReStraV (Internò et al., NeurIPS 2025) under the shared protocol; see src/mars/models/restrav/README.md.
_base_: ../../shared.yaml

data:
  train: [ffpp, gtav]
  image_size: 224                          # DINOv2 ViT-S/14 input, as released

model:
  name: restrav
  encoder_repo: facebookresearch/dinov2
  encoder_id: dinov2_vits14
  early_steps: 7
  early_angles: 6
  hidden: [64, 32]
  n_classes: 2
  encoder_chunk: 64

log:
  group: main_ffpp_gtav
  run_name: restrav_s0
