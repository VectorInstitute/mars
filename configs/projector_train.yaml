# ============================================================================
# Stage 2 — Modality Projectors  (tuning_mode: modality_projectors)
# Loads Stage 1's LoRA (frozen) from init_checkpoint, then trains ONLY the
# audio/visual bridge projectors. Same data + eval mechanics as Stage 1.
# ============================================================================

tuning_mode: modality_projectors
# REQUIRED: point at Stage 1's final_artifact/ — must match qlora_train.yaml's run_name exactly.
init_checkpoint: "checkpoints/qwen3omni-8k-av1m-thinker-lora/final_artifact"
resume_from_checkpoint: null

model_id: "Qwen/Qwen3-Omni-30B-A3B-Instruct"
attn_implementation: flash_attention_2

# ── Data (identical scope to Stage 1) ──────────────────────────────────────
manifest_dir: "${MANIFEST_DIR}"
data_root: "${DATA_ROOT}"
dataset_video_roots:
  av1m: "raw/AV-Deepfake1M-subset"
  #arenav: "raw/ArEnAV_subset"
  #lavdf: "raw/LAV-DF/LAV-DF"
  #polyglot: "raw/PolyGlotFake"
  #fakeavceleb: "raw/FakeAVCeleb_v1.2"

train_dataset_sources:
  av1m: ["av1m_train.jsonl"]
  #arenav: ["arenav_train.jsonl"]
  #lavdf: ["lavdf_train.jsonl"]
  #polyglot: ["polyglot_train.jsonl"]
  #fakeavceleb: ["fakeavceleb_train.jsonl"]

val_dataset_sources:
  av1m: ["av1m_val.jsonl"]
  #arenav: ["arenav_val.jsonl"]
  #lavdf: ["lavdf_val.jsonl"]
  #polyglot: ["polyglot_val.jsonl"]
  #fakeavceleb: ["fakeavceleb_val.jsonl"]

train_samples_per_dataset: 8000
val_samples_per_dataset: 1000
audio_sample_rate: 16000
num_frames: 32
max_seq_len: 4096
seed: 42

# ── LoRA (inherited from init_checkpoint, kept frozen — values here are just
#    provenance; Stage 2 does not re-fit the adapter) ─────────────────────────
lora_target_modules: ["q_proj", "v_proj"]
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

# ── Optimization (projectors are BF16 and few-param — smaller LR than Stage 1) ─
learning_rate: 0.0001
lr_scheduler_type: cosine
warmup_ratio: 0.03
micro_batch_size: 1
gradient_accumulation_steps: 16
max_steps: -1
num_train_epochs: 2.0
max_grad_norm: 1.0

# ── Eval / checkpoint selection ────────────────────────────────────────────
# Selection metric is validation loss (mean masked CE) — see SFTTrainer.evaluate
# in trainer.py. No in-loop generation; macro-F1/AUC are scored separately by the
# vLLM eval harness on saved checkpoints.
eval_strategy: steps
save_strategy: steps
eval_steps: 500
save_steps: 500
logging_steps: 10
save_total_limit: 3
load_best_model_at_end: true

# ── Output / naming ──────────────────────────────────────────────────────
# See qlora_train.yaml for what run_name is used for. wandb_group must match
# Stage 1's exactly, to pair the two stages' runs in the W&B UI.
output_dir: "checkpoints"
merge_after_train: false              # final stage — merge via merge.py, then eval

run_name: "qwen3omni-8k-av1m-projectors"
wandb_project: "deepfake-moe"
wandb_group: "qwen3omni-8k-av1m-2stage"
wandb_tags: ["stage2", "modality_projectors"]

# ── How to run (Slurm) ──────────────────────────────────────────────────────
# PREREQUISITE: Stage 1 must be finished and init_checkpoint above must point at
# its final_artifact/. Then, same launcher as Stage 1, different --config:
#   sbatch scripts/qlora_train.sh --config configs/projector_train.yaml
# Smoke / profile work the same way:
#   sbatch scripts/qlora_train.sh --config configs/projector_train.yaml --smoke-test
#   sbatch scripts/qlora_train.sh --config configs/projector_train.yaml --profile
# Cheap prelim — MUST re-point init_checkpoint at the prelim Stage 1 artifact
# (the default above is the full run you won't have produced in a prelim pass):
#   sbatch scripts/qlora_train.sh --config configs/projector_train.yaml \
#     --set init_checkpoint=checkpoints/qwen3omni-2k-thinker-lora-prelim/final_artifact \
#     --set train_samples_per_dataset=2000 --set val_samples_per_dataset=200 \
#     --set run_name=qwen3omni-2k-projectors-prelim
# After it finishes, merge to a standalone model for eval (needs QLORA_SFT_MERGED_DIR in .env):
#   python -m deepfake_moe.train.qlora_sft.merge \
#     --config configs/projector_train.yaml \
#     --artifact-dir checkpoints/qwen3omni-8k-av1m-projectors/final_artifact
