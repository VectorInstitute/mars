# Clip sampling, train, and log defaults shared by every model.
# Corpus identity and roles live in configs/datasets/<name>.yaml.
# data.test is the eval battery for every model. data.train and log.run_name
# stay on the model YAML (a list on the model YAML would replace this test list).

data:
  test: [ffpp, celebdf, dftimit, uadfv, genvideo, hififace_paired, gtav, df26]
  frame_stride: 2
  n_frames: 64
  clip_stride: null
  padding: last_frame
  image_size: 384
  num_workers: 8
  decode_backend: pyav

train:
  epochs: 3
  batch_size: 32
  micro_batch_size: 8
  eval_batch_size: 1
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  grad_clip: 1.0
  decay_steps: 1000
  decay_rate: 0.5
  class_balance: none
  amp_dtype: bfloat16
  seed: 0
  max_steps: null
  eval_every_epochs: 1

log:
  checkpoint_dir: checkpoints
  results_dir: results
  wandb: true
  wandb_project: mars
  wandb_entity: null
  log_every_steps: 25
