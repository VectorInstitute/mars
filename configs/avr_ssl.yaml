# AVR Stage 1 — self-supervised pretraining of imputation/router/experts.
# Loaded by AVRConfig.from_yaml(). Machine-specific paths come from .env.

model_id: "Qwen/Qwen3-Omni-30B-A3B-Instruct"

# ── Architecture ─────────────────────────────────────────────────────────
hidden_dim: 2048
num_experts: 4
top_k: 2
expert_ffn_dim: 4096
imputation_num_heads: 8
imputation_timestamp_bias: true
mask_query_bucket_seconds: 0.5
mask_query_max_seconds: 30.0

# ── Masking ───────────────────────────────────────────────────────────────
mask_window_seconds: 1.0

# ── Loss ──────────────────────────────────────────────────────────────────
gaussian_nll_warmup_steps: 0
router_aux_loss_coef: 0.01

# ── Data (paths from .env) ─────────────────────────────────────────────────
manifest_dir: "${MANIFEST_DIR}"
data_root: "${DATA_ROOT}"
dataset_video_roots:
  av1m: "raw/AV-Deepfake1M-subset"
  lavdf: "raw/LAV-DF/LAV-DF"
  polyglot: "raw/PolyGlotFake"
  fakeavceleb: "raw/FakeAVCeleb_v1.2"

train_dataset_sources:
  av1m: ["av1m_train.jsonl"]
  lavdf: ["lavdf_train.jsonl"]
  polyglot: ["polyglot_train.jsonl"]
  fakeavceleb: ["fakeavceleb_train.jsonl"]

val_dataset_sources:
  av1m: ["av1m_val.jsonl"]
  lavdf: ["lavdf_val.jsonl"]
  polyglot: ["polyglot_val.jsonl"]
  fakeavceleb: ["fakeavceleb_val.jsonl"]

train_samples_per_dataset: 10000
val_samples_per_dataset: 1000
audio_sample_rate: 16000
num_frames: 32
seed: 42

# ── Optimization ─────────────────────────────────────────────────────────
learning_rate: 0.0001
lr_scheduler_type: cosine
warmup_ratio: 0.03
micro_batch_size: 1
gradient_accumulation_steps: 16
max_steps: -1
num_train_epochs: 2.0
max_grad_norm: 1.0

# ── Loop mechanics ─────────────────────────────────────────────────────
eval_steps: 250
logging_steps: 10
dataloader_num_workers: 2

# ── Output / naming ─────────────────────────────────────────────────────
output_dir: "checkpoints"
run_name: "qwen3omni-avr-ssl-stage1"
wandb_project: "deepfake-moe"
wandb_group: "qwen3omni-avr"
wandb_tags: ["avr_ssl", "stage1"]
