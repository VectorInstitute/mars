[project]
name = "deepfake-moe"
version = "0.1.0"
description = "Qwen3-Omni audio-video deepfake-detection foundation."
readme = "README.md"
authors = [ {name = "Vector AI Engineering", email = "ai_engineering@vectorinstitute.ai"}]
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    # --- Qwen3-Omni model stack ---
    # NOTE: Qwen3-Omni needs a recent transformers; bump if load fails.
    "torch==2.11.0",
    "transformers>=5.5.3",
    "accelerate>=1.0.0",
    "qwen-omni-utils>=0.0.8",
    # --- media I/O ---
    "av>=12.0",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # torchvision>=0.23 dropped io.read_video; qwen-omni-utils falls back to it
    # unless torchcodec/decord is present, so pin torchcodec as the video backend.
    "torchcodec>=0.14.0",
    "torchvision==0.26.0",
    "nvidia-cudnn-cu12>=9.10.2.21",
    "nvidia-cusparselt-cu12>=0.7.1",
    "torchaudio==2.11.0",
    "vllm==0.24.0",
    "peft>=0.19.1",
    "bitsandbytes>=0.49.2",
    "wandb>=0.28.1",
]
[project.urls]
repository = "https://github.com/VectorInstitute/deepfake-moe"
[project.scripts]
deepfake-moe-forward = "deepfake_moe.run_forward:main"
deepfake-moe-eval = "deepfake_moe.run_eval:main"
deepfake-moe-train = "deepfake_moe.run_train:main"
deepfake-moe-qlora-train = "deepfake_moe.run_train:main"
deepfake-moe-qlora-merge = "deepfake_moe.train.qlora_sft.merge:main"
[project.entry-points."vllm.general_plugins"]
# Loaded by vLLM in every process (engine core + each spawned worker), so the
# Qwen3 processor compatibility patch no longer needs VLLM_WORKER_MULTIPROC_METHOD=fork
# to reach worker processes.
deepfake_moe_qwen3_patch = "deepfake_moe.models.vllm.qwen_omni_vllm:_patch_qwen3_processor_for_vllm"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = [
    "codecov>=2.1.13",
    "mypy>=1.19.1,<2",
    "nbqa>=1.9.1",
    "pip>=26.1", # Pinning version to address vulnerabilities CVE-2026-1703, CVE-2026-3219
    "pip-audit>=2.7.3",
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.13.3",
]
docs = [
    "jinja2>=3.1.6", # Pinning version to address vulnerability GHSA-cpwx-vrp4-4pq7
    "pygments>=2.20.0", # Pinning version to address vulnerability CVE-2026-4539
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.15",
    "pymdown-extensions>=10.21.2", # Pinning version to fix pygments 2.20.0 compatibility
    "mkdocstrings>=1.0.4",
    "mkdocstrings-python>=1.10.0",
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
    "tornado>=6.5.6", # Pinning version to address vulnerability CVE-2026-49854
]
# Default dependency groups to be installed
[tool.uv]
default-groups = ["dev", "docs"]
[tool.mypy]
follow_imports = "normal"
ignore_missing_imports = false
install_types = true
pretty = true
non_interactive = true
allow_untyped_defs = false
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
allow_subclassing_any = false
allow_untyped_calls = false
allow_incomplete_defs = false
allow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = true
implicit_reexport = false
strict_equality = true
extra_checks = true
mypy_path = "src"
# qwen_omni_utils ships no py.typed marker / stubs upstream — a genuine
# third-party gap, not something addressable from this side.
[[tool.mypy.overrides]]
module = "qwen_omni_utils.*"
ignore_missing_imports = true
[tool.ruff]
include = ["*.py", "pyproject.toml", "*.ipynb"]
exclude = []
line-length = 120
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "COM", # flake8-commas
    "C4", # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ICN", # flake8-import-conventions
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "W", # pycodestyle
    "N", # pep8-naming
    "ERA", # eradicate
    "PL", # pylint
]
fixable = ["A", "B", "COM", "C4", "RET", "SIM", "ICN", "Q", "RSE", "D", "E", "F", "I", "W", "N", "ERA", "PL"]
ignore = [
    "B905", # `zip()` without an explicit `strict=` parameter
    "E501", # line too long
    "D203", # 1 blank line required before class docstring
    "D213", # Multi-line docstring summary should start at the second line
    "PLR2004", # Replace magic number with named constant
    "PLR0913", # Too many arguments
    "COM812", # Missing trailing comma
    "ERA001", # Found commented-out code (too many false positives with math comments)
    "A001", # Ignore variable `input` is shadowing a Python builtin (common for torch)
    "A002", # Ignore variable `input` is shadowing a Python builtin in function (common for torch)
    "D301", # r-strings for docstrings with backslashes
]
# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]
# Ignoring undocumented public functions, public init, magic method, and magic numbers in tests folder
"tests/*" = ["D103", "D105", "D107"]
[tool.ruff.lint.pep8-naming]
ignore-names = ["X*", "setUp"]
[tool.ruff.lint.isort]
lines-after-imports = 2
[tool.ruff.lint.pydocstyle]
convention = "numpy"
[tool.ruff.lint.pycodestyle]
max-doc-length = 88
[tool.pytest.ini_options]
markers = [
    "integration_test: marks tests as integration tests",
]
# `thw` (grid_thw = temporal/height/width) is a Qwen tensor name, not a typo.
[tool.typos.default.extend-words]
thw = "thw"
[tool.coverage]
    [tool.coverage.run]
    source=["src/deepfake_moe"]
    omit=["tests/*", "*__init__.py"]
