[project]
name = "marscope"
version = "0.1.1"
description = "See what a video deepfake detector sees: scores, evidence and explanations, never a verdict"
readme = "README.md"
authors = [ {name = "Vector AI Engineering", email = "ai_engineering@vectorinstitute.ai"}]
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
]
repository = "https://github.com/VectorInstitute/marscope"
requires-python = ">=3.12,<3.15"  # ONNX Runtime has wheels for 3.12 to 3.14
dependencies = [
    # inference. ONNX Runtime GPU builds exist for Linux x86_64 and Windows x64; 1.26 is the last one
    # built for CUDA 12, which runs on any driver from CUDA 12 on (Colab, most clusters), while 1.28+
    # needs CUDA 13 (driver 580+). Elsewhere (Apple silicon, ARM Linux, Windows on ARM) the CPU build.
    "numpy>=2.0",
    "onnxruntime-gpu>=1.24,<1.27; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "onnxruntime>=1.24; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine != 'x86_64') or (sys_platform == 'win32' and platform_machine != 'AMD64')",
    # video
    "av>=14.0",
    "pillow>=11.0",
    "mediapipe>=0.10.20",
    "c2pa-python>=0.39.0",
    # models and policy
    "huggingface-hub>=0.30",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    # server
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    # report
    "openai>=1.60",
    "python-dotenv>=1.0",
    "reportlab>=4.0",
    # security pins kept from the template (transitive dependencies)
    "filelock==4.2.10",
    "requests>=2.33.0", # Pinning version to address vulnerability CVE-2026-25645
    "urllib3==2.8.0",
    "pygments>=2.20.0", # Pinning version to address vulnerability CVE-2026-4539
]

[project.optional-dependencies]
# CUDA 12 and cuDNN 9 libraries as wheels, for GPU machines without a system CUDA install.
cuda = ["onnxruntime-gpu[cuda,cudnn]>=1.24,<1.27; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')"]

[project.scripts]
marscope = "marscope.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "codecov>=2.1.13",
    "mypy>=1.20.1",
    "nbqa>=1.9.1",
    "pip>=26.1", # Pinning version to address vulnerabilities CVE-2026-1703, CVE-2026-3219
    "pip-audit>=2.7.3",
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "msgpack>=1.2.1", # Pinning version to address vulnerability GHSA-6v7p-g79w-8964
    "ruff>=0.13.3",
    "types-pyyaml>=6.0",
    "httpx>=0.28", # FastAPI TestClient
]
docs = [
    "jinja2>=3.1.6", # Pinning version to address vulnerability GHSA-cpwx-vrp4-4pq7
    "pygments>=2.20.0", # Pinning version to address vulnerability CVE-2026-4539
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.15",
    "pymdown-extensions>=10.21.2", # Pinning version to fix pygments 2.20.0 compatibility
    "mkdocstrings>=1.0.4",
    "mkdocstrings-python>=1.10.0",
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
    "tornado>=6.5.6", # Pinning version to address vulnerability CVE-2026-49854
]

# Default dependency groups to be installed
[tool.uv]
default-groups = ["dev", "docs"]

[tool.mypy]
follow_imports = "normal"
ignore_missing_imports = false
install_types = true
pretty = true
non_interactive = true
allow_untyped_defs = false
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
allow_subclassing_any = false
allow_untyped_calls = false
allow_incomplete_defs = false
allow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = true
implicit_reexport = false
strict_equality = true
extra_checks = true
mypy_path = "src"

[[tool.mypy.overrides]]
# Libraries without type information.
module = ["mediapipe.*", "c2pa.*", "reportlab.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.typos.default.extend-words]
# French UI, note and card text (the checker only knows English), plus a few identifiers.
abord = "abord"
algorithmes = "algorithmes"
apparence = "apparence"
artificiel = "artificiel"
befores = "befores"
bord = "bord"
Celle = "Celle"
celles = "celles"
Certains = "Certains"
certains = "certains"
choses = "choses"
classe = "classe"
Classe = "Classe"
Comparaison = "Comparaison"
comparaison = "comparaison"
confirme = "confirme"
constats = "constats"
contient = "contient"
copie = "copie"
cours = "cours"
discret = "discret"
effet = "effet"
entreprise = "entreprise"
Espace = "Espace"
Exemple = "Exemple"
exemple = "exemple"
fixe = "fixe"
garantie = "garantie"
groupes = "groupes"
indicat = "indicat"
indicateurs = "indicateurs"
juge = "juge"
langage = "langage"
Limite = "Limite"
listent = "listent"
mesure = "mesure"
mis = "mis"
mouvement = "mouvement"
mouvements = "mouvements"
naturels = "naturels"
nd = "nd"
objet = "objet"
principales = "principales"
probabilite = "probabilite"
projet = "projet"
quarante = "quarante"
raison = "raison"
registre = "registre"
reproductible = "reproductible"
ressemble = "ressemble"
reste = "reste"
servent = "servent"
signes = "signes"
Sur = "Sur"
sur = "sur"
transforme = "transforme"
ue = "ue"
UE = "UE"
valide = "valide"
visibles = "visibles"

[tool.ruff]
include = ["*.py", "pyproject.toml", "*.ipynb"]
exclude = []
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "COM", # flake8-commas
    "C4", # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ICN", # flake8-import-conventions
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "W", # pycodestyle
    "N", # pep8-naming
    "ERA", # eradicate
    "PL", # pylint
]
fixable = ["A", "B", "COM", "C4", "RET", "SIM", "ICN", "Q", "RSE", "D", "E", "F", "I", "W", "N", "ERA", "PL"]
ignore = [
    "B905", # `zip()` without an explicit `strict=` parameter
    "E501", # line too long
    "D203", # 1 blank line required before class docstring
    "D213", # Multi-line docstring summary should start at the second line
    "PLR2004", # Replace magic number with named constant
    "PLR0913", # Too many arguments
    "COM812", # Missing trailing comma
    "ERA001", # Found commented-out code (too many false positives with math comments)
    "A001", # Ignore variable `input` is shadowing a Python builtin (common for torch)
    "A002", # Ignore variable `input` is shadowing a Python builtin in function (common for torch)
    "D301", # r-strings for docstrings with backslashes
]

# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]
# Ignoring undocumented public functions, public init, magic method, and magic numbers in tests folder
"tests/*" = ["D103", "D105", "D107"]


[tool.ruff.lint.pep8-naming]
ignore-names = ["X*", "setUp"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.pytest.ini_options]
markers = [
    "integration_test: marks tests as integration tests",
]

[tool.coverage]
    [tool.coverage.run]
    source=["src/marscope"]
    omit=["tests/*", "*__init__.py"]
